<svg xmlns="http://www.w3.org/2000/svg" width="854" height="90" viewBox="0 0 854 90" role="img" aria-label="feito à mão em Brasília">
  <defs>
    <linearGradient id="flinha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b79bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="854" height="90" fill="#0b0820"/>
  <!-- estrelas miúdas piscando -->
  <g fill="#ffffff">
    <circle cx="120" cy="22" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="14" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="4.4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="24" r="1.1"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="16" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="806" cy="60" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="4.7s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="64" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>
  <!-- linha com ponto de luz viajando -->
  <rect x="90" y="44" width="674" height="2" rx="1" fill="url(#flinha)"/>
  <circle r="5" fill="url(#brilho)">
    <animateMotion path="M 100,45 L 754,45" dur="5.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <!-- centro: ✦ pulsando + assinatura -->
  <g transform="translate(427,45)">
    <circle r="26" fill="#17103d" stroke="#7c3aed" stroke-width="1.5"/>
    <path d="M 0 -12 L 3.2 -3.2 L 12 0 L 3.2 3.2 L 0 12 L -3.2 3.2 L -12 0 L -3.2 -3.2 Z" fill="#ffffff">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="427" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#9d96d0" letter-spacing="2">FEITO À MÃO EM BRASÍLIA</text>
</svg>
